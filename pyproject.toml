[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laia-flight-delay"
version = "0.3.0"
description = "Temporal flight delay severity baseline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2", "pyarrow>=15,<27", "joblib>=1.3,<2"
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"train.py" = ["E402"]
