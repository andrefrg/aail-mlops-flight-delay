# Estrutura do tutorial do docente: testes -> build -> publicação.
name: 1 - Continuous Integration
run-name: "${{ github.workflow }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar uv
        run: python -m pip install uv==0.9.5

      - name: Instalar as versões guardadas no lockfile
        run: uv sync --frozen

      - name: Testar a API
        run: uv run --frozen python -m pytest tests/test_api.py -v

      - name: Testar dados e modelo
        run: |
          uv run --frozen python -m pytest \
            tests/test_data_audit.py \
            tests/test_baseline.py \
            tests/test_model_contract.py \
            tests/test_training_workflow.py -v

      - name: Testar a promoção de modelos
        run: uv run --frozen python -m pytest tests/test_promote_model.py -v


  build-images:
    runs-on: ubuntu-latest
    needs: test-unit
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar o endereço das imagens
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          test "$REGISTRY" = 'ghcr.io'
          echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem de treino
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile.train
          platforms: linux/amd64
          push: false
          tags: training:${{ github.sha }}
          outputs: type=docker,dest=/tmp/training.tar

      - run: docker load --input /tmp/training.tar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - name: Construir imagem da API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile.serve
          platforms: linux/amd64
          push: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: serving:${{ github.sha }}
          outputs: type=docker,dest=/tmp/serving.tar

      - run: docker load --input /tmp/serving.tar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - name: Autenticar no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem de treino
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag "training:$GITHUB_SHA" "$IMAGE_PREFIX/training:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/training:$GITHUB_SHA"

      - name: Publicar imagem da API
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag "serving:$GITHUB_SHA" "$IMAGE_PREFIX/serving:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/serving:$GITHUB_SHA"

