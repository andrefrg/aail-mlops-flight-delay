name: 4 - Continuous Deployment

# O workflow completo está comentado abaixo até a integração estar pronta.
# Para reativar, remover este bloco e descomentar o workflow original.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Indicar que a integração está pendente
        run: |
          echo "::error::Esta etapa está desativada até integrar a API, o modelo, as imagens e os runners."
          exit 1

