name: 2 - Continuous Delivery

on:
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_commit:
        description: 'SHA completo de um commit com imagem publicada no GHCR'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: flight-delay-promotion
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}

jobs:
  train-model:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.head_branch == 'main' &&
         (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch'))))
    runs-on: [self-hosted, vm01]
    timeout-minutes: 180
    outputs:
      image_commit: ${{ steps.config.outputs.image_commit }}
      serving_image: ${{ steps.serving.outputs.image }}
    env:
      SERVING_CONTAINER: flight-delay-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter o commit da imagem publicada pelo CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: source-commit
          path: ${{ runner.temp }}/flight-delivery
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar configuração
        id: config
        env:
          MANUAL_COMMIT: ${{ inputs.image_commit }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            IMAGE_COMMIT=$(cat "$RUNNER_TEMP/flight-delivery/source-commit.txt")
          else
            IMAGE_COMMIT="$MANUAL_COMMIT"
          fi
          if [[ ${#IMAGE_COMMIT} -ne 40 || "$IMAGE_COMMIT" == *[!0123456789abcdef]* ]]; then
            echo "Indica o SHA completo de 40 caracteres de um commit."
            exit 1
          fi
          if [[ "$REGISTRY" != 'ghcr.io' ]]; then
            echo "Configura REGISTRY como ghcr.io."
            exit 1
          fi
          : "${MLFLOW_TRACKING_URI:?Configurar MLFLOW_TRACKING_URI}"
          : "${MLFLOW_EXPERIMENT_NAME:?Configurar MLFLOW_EXPERIMENT_NAME}"
          : "${MLFLOW_MODEL_NAME:?Configurar MLFLOW_MODEL_NAME}"
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=$REGISTRY/$repository" >> "$GITHUB_ENV"
          echo "IMAGE_COMMIT=$IMAGE_COMMIT" >> "$GITHUB_ENV"
          echo "image_commit=$IMAGE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Obter o código correspondente à imagem
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_COMMIT }}
          persist-credentials: false

      - name: Obter dados com DVC
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dvc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/dvc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" -m pip install 'dvc[ssh]>=3,<4'
          "$RUNNER_TEMP/dvc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/dvc" pull

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter imagem de treino
        run: docker pull "$IMAGE_PREFIX/training:$IMAGE_COMMIT"

      - name: Executar treino e registo no MLflow
        env:
          COMMIT_SHA: ${{ env.IMAGE_COMMIT }}
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dataset,dst=/data,readonly" \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME -e MLFLOW_EXPERIMENT_NAME -e COMMIT_SHA \
            "$IMAGE_PREFIX/training:$IMAGE_COMMIT" --data-dir /data

      - name: Obter imagem da API
        id: serving
        shell: bash
        run: |
          repository="$IMAGE_PREFIX/serving"
          tagged_image="$repository:$IMAGE_COMMIT"
          docker pull "$tagged_image"
          # Guardar o digest para testar e promover a mesma imagem.
          image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tagged_image" |
            awk -v prefix="$repository@sha256:" 'index($0, prefix) == 1 && !found { print; found = 1 }')
          if [[ -z "$image" ]]; then
            echo "Não foi possível determinar o digest da imagem $tagged_image."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Iniciar API com o modelo do treino
        env:
          SERVING_IMAGE: ${{ steps.serving.outputs.image }}
        run: |
          docker run -d \
            --name "$SERVING_CONTAINER" \
            -p 127.0.0.1:8081:8000 \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME \
            -e "MODEL_ALIAS=$IMAGE_COMMIT" \
            -e "MODEL_VERSION=$IMAGE_COMMIT" \
            "$SERVING_IMAGE"

      - name: Testar a API com o modelo treinado
        env:
          API_BASE_URL: http://127.0.0.1:8081
        run: python3 -m unittest discover -s tests -p test_e2e.py -v

      - name: Mostrar logs da API se o job falhar
        if: failure()
        run: docker logs "$SERVING_CONTAINER" || true

      - name: Remover o container da API
        if: always()
        run: docker rm -f "$SERVING_CONTAINER" || true

      - name: Remover ambiente temporário do DVC
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/dvc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  promote-staging:
    needs: train-model
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: [self-hosted, vm03]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      COMMIT_SHA: ${{ needs.train-model.outputs.image_commit }}
      SERVING_IMAGE: ${{ needs.train-model.outputs.serving_image }}
    steps:
      - name: Confirmar o commit validado na main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [[ -z "$COMMIT_SHA" || "$COMMIT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "O commit testado não corresponde ao commit do CI da main."
            exit 1
          fi

      - name: Obter o script de promoção do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem testada com a tag staging
        shell: bash
        run: |
          docker pull "$SERVING_IMAGE"
          staging_image="${SERVING_IMAGE%@*}:staging"
          docker tag "$SERVING_IMAGE" "$staging_image"
          docker push "$staging_image"

      - name: Atribuir o alias staging ao modelo testado
        env:
          FROM_ALIAS: ${{ env.COMMIT_SHA }}
          TO_ALIAS: staging
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/model_promotion/promote_model.py,dst=/app/promote_model.py,readonly" \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME -e FROM_ALIAS -e TO_ALIAS -e COMMIT_SHA \
            "$SERVING_IMAGE" /app/promote_model.py

      - name: Guardar o commit promovido
        run: printf '%s\n' "$COMMIT_SHA" > "$RUNNER_TEMP/source-commit.txt"

      - name: Publicar o commit para a etapa de staging
        uses: actions/upload-artifact@v4
        with:
          name: source-commit
          path: ${{ runner.temp }}/source-commit.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14
