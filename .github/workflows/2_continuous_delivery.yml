# Estrutura do tutorial: treino -> E2E -> imagem e modelo em staging.
name: 2 - Continuous Delivery
run-name: "${{ github.workflow }}"

on:
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write

# O mesmo grupo nas etapas 2/3/4 impede alterações simultâneas dos aliases/tags.
concurrency:
  group: flight-delay-promotion
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
  TRAIN_DATA_DIR: ${{ vars.TRAIN_DATA_DIR }}
  SERVING_CONTAINER: flight-delay-delivery-${{ github.run_id }}-${{ github.run_attempt }}
  TRAINING_CONTAINER: flight-delay-training-${{ github.run_id }}-${{ github.run_attempt }}
  API_BASE_URL: http://127.0.0.1:9001

jobs:
  train-model:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, dei-training]
    timeout-minutes: 180
    steps:
      - name: Obter o commit da execução anterior
        uses: actions/download-artifact@v4
        with:
          name: source-commit
          path: ${{ runner.temp }}/flight-delivery
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar commit e endereço das imagens
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          COMMIT_SHA=$(cat "$RUNNER_TEMP/flight-delivery/source-commit.txt")
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$COMMIT_SHA" = "$EXPECTED_SHA"
          test "$REGISTRY" = 'ghcr.io'
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: python -m pip install uv==0.9.5
      - run: uv sync --frozen

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter imagem de treino
        run: docker pull "$IMAGE_PREFIX/training:$COMMIT_SHA"

      - name: Executar treino e registo do modelo
        shell: bash
        run: |
          : "${MLFLOW_TRACKING_URI:?Configurar MLFLOW_TRACKING_URI}"
          : "${MLFLOW_EXPERIMENT_NAME:?Configurar MLFLOW_EXPERIMENT_NAME}"
          : "${MLFLOW_MODEL_NAME:?Configurar MLFLOW_MODEL_NAME}"
          : "${TRAIN_DATA_DIR:?Configurar TRAIN_DATA_DIR}"
          [[ "$TRAIN_DATA_DIR" = /* ]] && test -d "$TRAIN_DATA_DIR"
          docker run --rm --name "$TRAINING_CONTAINER" \
            --mount "type=bind,src=$TRAIN_DATA_DIR,dst=/data,readonly" \
            -e DATA_DIR=/data \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME -e MLFLOW_EXPERIMENT_NAME -e COMMIT_SHA \
            "$IMAGE_PREFIX/training:$COMMIT_SHA"

      - name: Obter imagem da API
        run: docker pull "$IMAGE_PREFIX/serving:$COMMIT_SHA"

      - name: Iniciar API com o modelo deste commit
        env:
          MODEL_ALIAS: ${{ env.COMMIT_SHA }}
        run: |
          docker run -d --name "$SERVING_CONTAINER" -p 127.0.0.1:9001:8080 \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME -e MODEL_ALIAS \
            "$IMAGE_PREFIX/serving:$COMMIT_SHA"

      - name: Testar a integração da API com o modelo
        run: uv run --frozen python -m pytest tests/test_e2e.py -v

      - name: Publicar imagem com tag staging
        run: |
          docker tag "$IMAGE_PREFIX/serving:$COMMIT_SHA" "$IMAGE_PREFIX/serving:staging"
          docker push "$IMAGE_PREFIX/serving:staging"

      - name: Promover modelo para staging
        env:
          FROM_ALIAS: ${{ env.COMMIT_SHA }}
          TO_ALIAS: staging
        run: uv run --frozen python scripts/promote_model.py

      - name: Mostrar logs em caso de erro
        if: failure()
        run: docker logs "$SERVING_CONTAINER" || true

      - name: Remover containers temporários
        if: always()
        run: |
          docker rm -f "$SERVING_CONTAINER" "$TRAINING_CONTAINER" >/dev/null 2>&1 || true

      - name: Passar o commit para a etapa de staging
        uses: actions/upload-artifact@v4
        with:
          name: source-commit
          path: ${{ runner.temp }}/flight-delivery/source-commit.txt
          if-no-files-found: error
          retention-days: 14
